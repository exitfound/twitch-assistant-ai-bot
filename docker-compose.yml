services:
  bot:
    build: .
    container_name: twitch-bot
    image: twitch-assistant-ai-bot:latest
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /data
    command: ["/app/bot.py"]
    user: "1000:1000"
    env_file: .env
    environment:
      BOT_DB_PATH: /data/chat_history.db
      MASCOT_HOST: 0.0.0.0
    # SSE feed of the mascot overlay; MASCOT_PUBLISH (from .env) is the host address,
    # 127.0.0.1 unless set, so nothing is reachable from outside by default
    ports:
      - "${MASCOT_PUBLISH:-127.0.0.1}:${MASCOT_PORT:-8787}:${MASCOT_PORT:-8787}"
    volumes:
      - ./:/app:ro
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
