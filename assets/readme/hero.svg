<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Twitch AI Bot</title>
  <desc id="desc">Чат-бот для Twitch на Gemini: отвечает, когда его зовут в чате, с контекстом эфира и памятью о зрителях, ведёт игру на баллах канала. Справа – три способа позвать бота и его команды.</desc>

  <rect width="1200" height="420" rx="24" fill="#0d0c13"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', sans-serif">
    <text x="64" y="94" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#9b97ad">TWITCH · GEMINI · DISCORD</text>
    <text x="62" y="170" font-size="66" font-weight="800" fill="#f1f0f6">Twitch AI Bot</text>
    <text x="64" y="226" font-size="26" fill="#c9c6d6">Отвечает с контекстом эфира, помнит</text>
    <text x="64" y="262" font-size="26" fill="#c9c6d6">зрителей и ведёт в чате свою игру</text>

    <g id="tiers" font-size="19" font-weight="600" fill="#f1f0f6">
      <circle cx="72" cy="330" r="7" fill="#33c5c7"/><text x="86" y="337">Фолловер</text>
      <circle cx="206" cy="330" r="7" fill="#ff6eae"/><text x="220" y="337">VIP</text>
      <circle cx="280" cy="330" r="7" fill="#4fd474"/><text x="294" y="337">Модер</text>
      <circle cx="380" cy="330" r="7" fill="#a98bff"/><text x="394" y="337">Саб</text>
      <circle cx="456" cy="330" r="7" fill="#ff6b6b"/><text x="470" y="337">Стример</text>
    </g>
    <text x="64" y="374" font-size="18" fill="#9b97ad">одна лестница лимитов по статусу зрителя</text>
  </g>

  <g id="chat-proof" transform="translate(652 44)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', sans-serif">
    <rect width="500" height="332" rx="16" fill="#16151f" stroke="#2c2a3a" stroke-width="1.5"/>
    <text x="28" y="42" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="18" fill="#9b97ad">как позвать бота</text>

    <g font-size="20">
      <circle cx="34" cy="82" r="6" fill="#33c5c7"/>
      <text x="50" y="89" font-weight="700" fill="#33c5c7">зритель</text>
      <text x="148" y="89" fill="#f1f0f6"><tspan fill="#b18cff" font-weight="700">сосурян</tspan>, &lt;вопрос&gt;</text>

      <circle cx="34" cy="126" r="6" fill="#ff6eae"/>
      <text x="50" y="133" font-weight="700" fill="#ff6eae">зритель</text>
      <text x="148" y="133" fill="#f1f0f6"><tspan fill="#b18cff" font-weight="700">@ник_бота</tspan> &lt;вопрос&gt;</text>

      <circle cx="34" cy="170" r="6" fill="#4fd474"/>
      <text x="50" y="177" font-weight="700" fill="#4fd474">зритель</text>
      <text x="148" y="177" fill="#f1f0f6">↳ реплай на сообщение бота</text>
    </g>

    <line x1="28" y1="204" x2="472" y2="204" stroke="#2c2a3a" stroke-width="1.5"/>
    <text x="28" y="236" font-size="18" fill="#9b97ad">или команда – без обращения</text>

    <g id="commands" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600">
      <g transform="translate(28 252)">
        <rect width="64" height="34" rx="8" fill="#1d1c28" stroke="#b18cff"/><text x="32" y="23" text-anchor="middle" fill="#b18cff">!ask</text>
        <rect x="74" width="64" height="34" rx="8" fill="#1d1c28" stroke="#b18cff"/><text x="106" y="23" text-anchor="middle" fill="#b18cff">!who</text>
        <rect x="148" width="98" height="34" rx="8" fill="#1d1c28" stroke="#b18cff"/><text x="197" y="23" text-anchor="middle" fill="#b18cff">!versus</text>
        <rect x="256" width="106" height="34" rx="8" fill="#1d1c28" stroke="#b18cff"/><text x="309" y="23" text-anchor="middle" fill="#b18cff">!summary</text>
        <rect x="372" width="74" height="34" rx="8" fill="#1d1c28" stroke="#ff9f43"/><text x="409" y="23" text-anchor="middle" fill="#ff9f43">!roll</text>
      </g>
    </g>
  </g>
</svg>
