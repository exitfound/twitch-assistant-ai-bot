services:
  bot:
    build: .
    container_name: twitch-bot
    image: twitch-assistant-ai-bot:latest
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /data
    command: ["/app/bot.py"]
    user: "1000:1000"
    env_file: .env
    environment:
      BOT_DB_PATH: /data/chat_history.db
      MASCOT_HOST: 0.0.0.0
      # The bot's API for the services: on the compose network only, never published
      BOT_API_HOST: 0.0.0.0
      ROLL_URL: http://roll:${ROLL_API_PORT:-8789}
    ports:
      - "${MASCOT_PUBLISH:-127.0.0.1}:${MASCOT_PORT:-8787}:${MASCOT_PORT:-8787}"
    volumes:
      - ./:/app:ro
      - ./data:/data
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # The «залупа стрима» game (src/roll/): the same image, its own process. It reaches Twitch
  # only through the bot's API and shares the database file with it
  roll:
    image: twitch-assistant-ai-bot:latest
    container_name: twitch-roll
    restart: unless-stopped
    stop_grace_period: 15s
    working_dir: /data
    command: ["/app/roll.py"]
    user: "1000:1000"
    env_file: .env
    environment:
      BOT_DB_PATH: /data/chat_history.db
      ROLL_API_HOST: 0.0.0.0
      ROLL_OVERLAY_HOST: 0.0.0.0
      BOT_API_URL: http://bot:${BOT_API_PORT:-8790}
    ports:
      - "${ROLL_PUBLISH:-127.0.0.1}:${ROLL_OVERLAY_PORT:-8788}:${ROLL_OVERLAY_PORT:-8788}"
    volumes:
      - ./:/app:ro
      - ./data:/data
    logging: *logging
