services:
  bot:
    build: .
    container_name: twitch-bot
    image: twitch-assistant-ai-bot:latest
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /data
    command: ["/app/bot.py"]
    user: "1000:1000"
    env_file: .env
    environment:
      BOT_DB_PATH: /data/chat_history.db
    volumes:
      - ./:/app:ro
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
