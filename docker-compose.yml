services:
  bot:
    build: .
    image: twitch-assistant-ai-bot:latest
    container_name: twitch-bot
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /data
    command: ["/app/bot.py"]
    env_file: .env
    ports:
      - "4343:4343"
    environment:
      TZ: Europe/Moscow
      BOT_DB_PATH: /data/chat_history.db
      BOT_HEARTBEAT: /data/heartbeat
      LOG_FILE: /logs/bot.log
    volumes:
      - ./:/app
      - ./data:/data
      - ./logs:/logs
    healthcheck:
      test: ["CMD", "/usr/bin/python3.11", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/data/heartbeat')<180 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
