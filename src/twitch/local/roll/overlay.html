<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roll – оверлей</title>
<!--
  Оверлей игры Roll для OBS (Browser Source, 1920×1080). Бот отдаёт страницу на /roll/
  и события на /roll/events. Параметры адреса:
    layout=feed|left|card|hud  вид: лента справа (по умолчанию), левый верхний угол (титулы и под
                           ними одна карточка, новая сменяет старую), карточка по центру, плашка снизу
    scale=0.8              размер оверлея от обычного (0.3–3), рисуется заново, а не растягивается
    titles=5               титулы гаснут через столько минут после последнего хода игры и возвращаются
                           с новым; 0 – видны всегда
    board=10               сколько секунд плашка !rollboard («Китежанин месяца») стоит напротив титулов
    nicks=0                ники заменяются на «Игрок 1, 2…»
    regalia=0              без полосы под титулами: победители прошлого месяца, шкала и лидер этого
    demo=1                 страница сама играет – проверить вид без эфира и без бота; встроенную в другую
                           страницу ведут сообщения postMessage: {make: 'curse'}, {auto: false}, {live: false}
    demo=mass              то же, но по кругу АГОНИЯ ЧЕРНОМИРЬЯ и БЛАГОСЛОВЕНИЕ СВЕТЛОЯРА с бросками между ними
    demo=board             то же, но по кругу плашка «Китежанин месяца» – то за этот месяц, то итоги прошлого
                           с победителем жребия – и броски под ней
    fx=0                   без эффекта массовых фласок во весь кадр, только карточка
    server=http://host:8787  адрес бота, если страница открыта как локальный файл
  Тексты карточек – в TEXT ниже. Подробно – BOT.md, «Оверлей игры в OBS».
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Not render-blocking: without the network the overlay runs on system fonts at once -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700&family=Ruslan+Display&family=Unbounded:wght@700;900&display=swap">
<style>
/* rgba before each color-mix: Chromium before 111 (the browser of OBS 30 and older) drops color-mix;
   each rgba is the same --o-* colour at the same share, so a palette change edits both */
/* The page is the whole OBS frame: a size container, so every size is in cqw and the
   overlay scales with the Browser Source width. ?scale= narrows or widens the container,
   anchored on the side the layout sits on, so a resize is laid out again rather than resampled */
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
.stage {
  position: fixed; top: 0; bottom: 0; left: 0; width: calc(100% * var(--scale, 1)); container-type: inline-size;
  /* Dusky lavender with one tone per spell: bright lavender Roll, turquoise reroll, dark violet curse,
     blue shield, light gold for everything holy, bright yellow flasks, blood red АГОНИЯ ЧЕРНОМИРЬЯ and lake
     azure БЛАГОСЛОВЕНИЕ СВЕТЛОЯРА; the titles are burgundy and dark blue */
  --o-bg: rgba(36, 30, 56, .88); --o-fg: #f7f4ff; --o-muted: #c2b8dc; --o-line: #a493d9;
  --o-accent: #b9a0ff; --o-reroll: #3fd9c8; --o-curse: #9a63f5; --o-curse-bg: rgba(46, 20, 86, .92);
  --o-shield: #5c9dff; --o-light: #ffe0a0; --o-flask: #ffd43b; --o-good: #e0587c; --o-bad: #5270e8;
  --o-agony: #f0434f; --o-agony-bg: rgba(48, 12, 20, .92); --o-svet: #8fdcff;
  --o-bad-ink: #8aa0ff; /* the dark blue frames the plate; numbers and the icon take a lighter blue to stay legible */
  --o-display: 'Ruslan Display', 'Golos Text', serif; --o-body: 'Golos Text', system-ui, sans-serif;
  --o-num: 'Unbounded', 'Golos Text', sans-serif;
  --o-radius: .5cqw; --o-border: .12cqw solid var(--o-line); --o-shadow: 0 .6cqw 2cqw #0009;
  /* The gap between the frame's edge and the plates: the titles, the board and the feed share it */
  --o-edge: calc(1.6cqw - 10px);
  color: var(--o-fg); font-family: var(--o-body);
}
.stage[data-layout="feed"] { left: auto; right: 0; }
.stage[data-layout="card"] { right: 0; margin: 0 auto; }
* { box-sizing: border-box; }

/* ---------- card ---------- */
.card {
  background: var(--o-bg); color: var(--o-fg); border: var(--o-border); border-radius: var(--o-radius);
  box-shadow: var(--o-shadow); position: relative; overflow: hidden;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: .8cqw;
  padding: .6cqw .9cqw;
  animation: card-in .45s cubic-bezier(.2, .9, .3, 1.2) both;
}
.card.out { animation: card-out .5s ease-in forwards; }
/* A card is set like a title plate: the move in the display face, small and tinted by its
   colour, the nick under it, the number on the right */
.card .ico { width: 1.9cqw; height: 1.9cqw; color: var(--tone, var(--o-accent)); }
.card .ico svg { width: 100%; height: 100%; display: block; }
.card .body { min-width: 0; }
.card .what { font: 1.06cqw/1.2 var(--o-display); letter-spacing: 0; color: var(--o-muted);
  color: color-mix(in srgb, var(--tone, var(--o-accent)) 40%, var(--o-fg)); }
/* «@actor → @target» with two long nicks takes a second line rather than losing the target */
.card .who { font: 700 1.05cqw/1.2 var(--o-body); overflow: hidden; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .sub { font: 500 .85cqw/1.35 var(--o-body); color: var(--o-muted); }
.card .num { font: 900 1.7cqw/1 var(--o-num); font-variant-numeric: tabular-nums; text-align: right; min-width: 3.4cqw; }
.card .num small { display: block; font: 600 .8cqw/1.2 var(--o-body); color: var(--o-muted); letter-spacing: .03em; margin-top: .25cqw; white-space: nowrap; }
.num.low { color: var(--o-bad-ink); }
.num.high { color: var(--o-good); }
.num.spin { opacity: .75; }
.num.land { animation: land .35s ease-out; }
.strike { text-decoration: line-through; opacity: .6; }

.card.t-curse, .card.t-sglaz { --tone: var(--o-curse); background: var(--o-curse-bg); }
.card.t-shield, .card.t-blocked { --tone: var(--o-shield); }
.card.t-bless, .card.t-cleanse, .card.t-lift { --tone: var(--o-light); }
.card.t-reroll { --tone: var(--o-reroll); }
.card.t-flask, .card.by-flask, .card.lucky { --tone: var(--o-flask); }
.card.t-flask.agony { --tone: var(--o-agony); background: var(--o-agony-bg); }
.card.t-flask.svet { --tone: var(--o-svet); }
.card.agonized { --tone: var(--o-agony); }
/* The frame takes the card's tone; a browser without color-mix keeps the plain frame */
.card { border-color: color-mix(in srgb, var(--tone, var(--o-accent)) 75%, transparent); }
.card.t-curse::after, .card.t-sglaz::after { /* a chain sweeping across a fresh curse */
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(115deg, transparent 0 1.6cqw, rgba(154, 99, 245, .5) 1.6cqw 2cqw);
  background: repeating-linear-gradient(115deg, transparent 0 1.6cqw, color-mix(in srgb, var(--o-curse) 50%, transparent) 1.6cqw 2cqw);
  animation: chain 1.4s ease-out both;
}
.card.t-shield::after, .card.t-bless::after, .card.t-blocked::after { /* a bubble around a protected nick */
  content: ''; position: absolute; left: .4cqw; top: 50%; width: 2.9cqw; height: 2.9cqw; margin-top: -1.45cqw;
  border-radius: 50%; border: .18cqw solid var(--tone); pointer-events: none; animation: bubble 1.2s ease-out both;
}
.card.t-blocked { animation: card-in .45s cubic-bezier(.2,.9,.3,1.2) both, shake .4s .45s ease-in-out; }
/* The flask is drunk: the icon tips up and its potion drains, then the potion takes effect –
   a yellow glow spreads from the icon over the card and bubbles rise through it */
.card.t-flask .ico svg { transform-origin: 50% 80%; animation: sip 1.3s .15s ease-in-out both; }
.card.t-flask .ico .liq { transform-box: fill-box; transform-origin: 50% 100%; animation: drain 1s .35s ease-in both; }
.card.t-flask::after {
  content: ''; position: absolute; inset: -30%; pointer-events: none; transform-origin: 20% 50%;
  background: radial-gradient(circle at 20% 50%, rgba(255, 212, 59, .55) 0 10%, transparent 55%);
  background: radial-gradient(circle at 20% 50%, color-mix(in srgb, var(--tone) 55%, transparent) 0 10%, transparent 55%);
  animation: haze 1.4s 1.1s ease-out both;
}
.card.t-cleanse::after, .card.t-lift::after { /* the curse breaking */
  content: ''; position: absolute; inset: -20%; pointer-events: none;
  background: radial-gradient(circle at 12% 50%, rgba(255, 224, 160, .55) 0 8%, transparent 30%);
  background: radial-gradient(circle at 12% 50%, color-mix(in srgb, var(--o-light) 55%, transparent) 0 8%, transparent 30%);
  animation: burst 1s ease-out both;
}
/* A soft light in the move's colour, once as the card lands; a plain Roll stays plain. The chain,
   the bubble and the burst live on ::after, so this one takes ::before */
.card.t-extra::before, .card.t-title::before, .card.t-reroll::before, .card.t-curse::before, .card.t-sglaz::before,
.card.t-shield::before, .card.t-blocked::before, .card.t-bless::before, .card.t-flask::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
}
.card.t-extra::before, .card.t-title::before { /* a glint crossing the card, a coin catching the light */
  background: linear-gradient(105deg, transparent 35%, rgba(185, 160, 255, .35) 50%, transparent 65%);
  background: linear-gradient(105deg, transparent 35%, color-mix(in srgb, var(--o-accent) 35%, transparent) 50%, transparent 65%);
  animation: glint 1.1s .15s ease-out both;
}
.card.t-reroll::before { /* the roll changing hands: a glow flies from the icon to the number */
  right: auto; width: 35%;
  background: radial-gradient(ellipse at center, rgba(63, 217, 200, .45), transparent 70%);
  background: radial-gradient(ellipse at center, color-mix(in srgb, var(--o-reroll) 45%, transparent), transparent 70%);
  animation: swap 1.1s .1s ease-in-out both;
}
.card.t-curse::before, .card.t-sglaz::before { /* a haze spreading from the icon under the chain */
  inset: -30%; transform-origin: 20% 50%;
  background: radial-gradient(circle at 20% 50%, rgba(154, 99, 245, .7) 0 12%, transparent 55%);
  background: radial-gradient(circle at 20% 50%, color-mix(in srgb, var(--o-curse) 70%, transparent) 0 12%, transparent 55%);
  animation: haze 1.6s ease-out both;
}
.card.t-shield::before { /* the shield going up: two waves from the icon */
  transform-origin: 9% 50%;
  background: radial-gradient(circle at 9% 50%, rgba(92, 157, 255, .6) 0 8%, transparent 38%);
  background: radial-gradient(circle at 9% 50%, color-mix(in srgb, var(--o-shield) 60%, transparent) 0 8%, transparent 38%);
  animation: waves 1.3s ease-out both;
}
.card.t-blocked::before { /* the hit against the shield, as the card shakes */
  transform-origin: 92% 50%;
  background: radial-gradient(circle at 92% 50%, rgba(92, 157, 255, .5) 0 5%, transparent 35%);
  background: radial-gradient(circle at 92% 50%, color-mix(in srgb, var(--tone) 50%, transparent) 0 5%, transparent 35%);
  animation: impact .7s .4s ease-out both;
}
.card.t-bless::before { /* warm light falling from above */
  background: radial-gradient(ellipse 70% 140% at 12% -20%, rgba(255, 224, 160, .65), transparent 70%);
  background: radial-gradient(ellipse 70% 140% at 12% -20%, color-mix(in srgb, var(--o-light) 65%, transparent), transparent 70%);
  animation: halo 1.6s ease-out both;
}
.card.t-flask::before { /* bubbles rising through the potion */
  --b: rgba(255, 212, 59, .75); --b: color-mix(in srgb, var(--tone) 75%, transparent);
  background: radial-gradient(circle at 10% 85%, var(--b) 0 .22cqw, transparent .3cqw),
              radial-gradient(circle at 28% 95%, var(--b) 0 .15cqw, transparent .22cqw),
              radial-gradient(circle at 47% 80%, var(--b) 0 .25cqw, transparent .33cqw),
              radial-gradient(circle at 66% 92%, var(--b) 0 .17cqw, transparent .24cqw),
              radial-gradient(circle at 85% 86%, var(--b) 0 .21cqw, transparent .29cqw);
  animation: brew 1.6s 1.2s ease-out both;
}
.card.lucky::before { /* a throw the luck flask lifted: a yellow glint crosses it */
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255, 212, 59, .4) 50%, transparent 65%);
  background: linear-gradient(105deg, transparent 35%, color-mix(in srgb, var(--o-flask) 40%, transparent) 50%, transparent 65%);
  animation: glint 1.1s .15s ease-out both;
}
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: .3cqw; background: rgba(154, 99, 245, .25); background: color-mix(in srgb, var(--o-curse) 25%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--o-curse); width: var(--from); animation: drop 1.1s .4s ease-in-out forwards; }

@keyframes card-in { from { opacity: 0; transform: translateY(1.2cqw) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes card-out { to { opacity: 0; transform: translateY(-1cqw) scale(.97); } }
@keyframes land { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes chain { from { transform: translateX(-100%); opacity: 1; } 70% { opacity: 1; } to { transform: translateX(10%); opacity: .25; } }
@keyframes bubble { 0% { transform: scale(.3); opacity: 0; } 40% { opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-.5cqw); } 50% { transform: translateX(.5cqw); } 75% { transform: translateX(-.3cqw); } }
@keyframes burst { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
@keyframes drop { to { width: var(--to); } }
@keyframes glint { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@keyframes swap { from { transform: translateX(-20%); opacity: 0; } 25%, 75% { opacity: 1; } to { transform: translateX(240%); opacity: 0; } }
@keyframes haze { from { transform: scale(.5); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
@keyframes waves { 0% { transform: scale(.6); opacity: 0; } 20% { opacity: 1; } 45% { transform: scale(1); opacity: .3; }
                   65% { opacity: .9; } 100% { transform: scale(1.3); opacity: 0; } }
@keyframes impact { from { transform: scale(.6); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
@keyframes halo { from { transform: translateY(-30%); opacity: 0; } 35% { opacity: 1; } to { transform: translateY(10%); opacity: 0; } }
@keyframes brew { from { transform: translateY(30%); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(-75%); opacity: 0; } }
@keyframes sip { 0% { transform: none; } 30%, 70% { transform: translateY(-12%) rotate(-38deg); } 100% { transform: none; } }
@keyframes drain { to { transform: scaleY(.15); } }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--tone); } 100% { box-shadow: 0 0 0 1.2cqw transparent; } }

/* ---------- titles ---------- */
.titles { display: grid; gap: .5cqw; transition: opacity .6s; }
.titles.empty { opacity: 0; }
.title {
  background: var(--o-bg); color: var(--o-fg); border: var(--o-border); border-radius: var(--o-radius); box-shadow: var(--o-shadow);
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: .8cqw; padding: .6cqw .9cqw; min-width: 0;
}
.title .ico { width: 1.9cqw; height: 1.9cqw; }
.title .ico svg { width: 100%; height: 100%; display: block; }
.title.best { --tone: var(--o-good); }
.title.worst { --tone: var(--o-bad); --ink: var(--o-bad-ink); }
/* A title plate is lit from the side of its icon in its own colour; without color-mix it stays plain */
.title {
  border-color: color-mix(in srgb, var(--tone) 75%, transparent);
  background: linear-gradient(90deg, color-mix(in srgb, var(--tone) 22%, transparent), transparent 70%), var(--o-bg);
}
.title .ico { color: var(--ink, var(--tone)); }
.title .lbl { font: 1.06cqw/1.2 var(--o-display); letter-spacing: 0; color: var(--o-muted); color: color-mix(in srgb, var(--tone) 40%, var(--o-fg)); }
.title .nick { font: 700 1.05cqw/1.2 var(--o-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title .val { font: 900 1.7cqw/1 var(--o-num); font-variant-numeric: tabular-nums; }
.title .val { color: var(--ink, var(--tone)); }
.title.changed { animation: flash .9s ease-out; }

/* ---------- regalia: the strip under the titles, it fades with them ---------- */
/* The last month's first places, this month's days on a bar and its leader. Across both columns of hud */
.regalia {
  grid-column: 1 / -1; display: grid; gap: .3cqw; padding: .5cqw .9cqw .6cqw; min-width: 0;
  background: var(--o-bg); border: var(--o-border); border-radius: var(--o-radius); box-shadow: var(--o-shadow);
  font: 500 .85cqw/1.3 var(--o-body); color: var(--o-muted);
}
.regalia .r-row { display: grid; grid-template-columns: 1.2cqw 1fr; align-items: center; column-gap: .5cqw; min-width: 0; }
.regalia .r-row.best { --tone: var(--o-good); }
.regalia .r-row.worst { --tone: var(--o-bad); --ink: var(--o-bad-ink); }
.regalia .r-row.lead, .regalia .r-month { --tone: var(--o-light); }
.regalia .ico { width: 1.2cqw; height: 1.2cqw; color: var(--ink, var(--tone)); }
.regalia .ico svg { width: 100%; height: 100%; display: block; }
.regalia .r-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.regalia b { color: var(--o-fg); font-weight: 700; }
.regalia .r-month { display: grid; grid-template-columns: 1.2cqw auto 1fr auto; align-items: center; column-gap: .5cqw; white-space: nowrap; }
.regalia .r-month b { margin-right: .1cqw; }
.regalia .r-bar { height: .35cqw; border-radius: .2cqw; background: rgba(255, 255, 255, .1); overflow: hidden; }
.regalia .r-bar i { display: block; height: 100%; width: var(--p); background: linear-gradient(90deg, var(--o-line), var(--o-light)); }
/* The last month's champion wears a crown next to the nick, on cards and title plates */
.cr { color: var(--o-light); font: 400 1em/1 'Segoe UI Symbol', 'DejaVu Sans', sans-serif; margin-left: .25em; }

/* ---------- the month's board: opposite the titles for a while after !rollboard ---------- */
/* A stage of its own, anchored on the other edge: ?scale= draws each stage toward its own edge,
   so the plate mirrors the titles at any scale. Only opacity and transform move */
.stage.side[data-side="right"] { left: auto; right: 0; }
.board {
  position: absolute; top: var(--o-edge); right: var(--o-edge); width: 27.75cqw; display: grid; gap: .7cqw; padding: .8cqw 1cqw 1cqw;
  background: var(--o-bg); color: var(--o-fg); border: var(--o-border); border-radius: var(--o-radius); box-shadow: var(--o-shadow);
  opacity: 0; visibility: hidden; transform: translateX(1.5cqw);
  transition: opacity .5s, transform .5s cubic-bezier(.2, .9, .3, 1), visibility 0s .5s;
}
.stage.side[data-side="left"] .board { right: auto; left: var(--o-edge); width: 26.25cqw; transform: translateX(-1.5cqw); }
.stage.side .board.on { opacity: 1; visibility: visible; transform: none; transition: opacity .5s, transform .5s cubic-bezier(.2, .9, .3, 1); }
.board .b-head { display: grid; gap: .15cqw; }
.board .b-title { font: 1.3cqw/1.2 var(--o-display); color: var(--o-light); white-space: nowrap; }
.board .b-sub { font: 500 .85cqw/1.2 var(--o-body); color: var(--o-muted); white-space: nowrap; }
.board .b-part { display: grid; gap: .3cqw; }
.board .b-part.best { --tone: var(--o-good); --row: rgba(224, 88, 124, .24); }
.board .b-part.worst { --tone: var(--o-bad); --ink: var(--o-bad-ink); --row: rgba(82, 112, 232, .28); }
.board .b-lbl { display: flex; align-items: center; gap: .5cqw; font: 1.02cqw/1.2 var(--o-display); color: var(--ink, var(--tone)); white-space: nowrap; }
.board .b-lbl span:last-child::after { content: ':'; }
.board .b-lbl .ico { width: 1.5cqw; height: 1.5cqw; flex: none; }
.board .b-lbl .ico svg { width: 100%; height: 100%; display: block; }
.board .b-row {
  display: grid; grid-template-columns: 1.4cqw 1fr auto; align-items: center; column-gap: .6cqw;
  padding: .3cqw .6cqw; border-radius: .35cqw; background: rgba(255, 255, 255, .04);
}
.board .b-row.first { background: linear-gradient(90deg, var(--row), transparent 75%), rgba(255, 255, 255, .04); }
.board .b-place { font: 900 1cqw/1 var(--o-num); color: var(--o-muted); text-align: center; }
.board .b-row.first .b-place { color: var(--ink, var(--tone)); }
.board .b-nick { font: 700 1.05cqw/1.3 var(--o-body); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .b-val { font: 900 1.3cqw/1 var(--o-num); font-variant-numeric: tabular-nums; color: var(--ink, var(--tone)); }
.board .b-drawn { font: 500 .75cqw/1 var(--o-body); color: var(--o-muted); margin-left: .3cqw; }
.board .b-row.none { grid-template-columns: 1fr; font: 500 .95cqw/1.3 var(--o-body); color: var(--o-muted); }
.board.on .b-row { animation: row-in .45s cubic-bezier(.2, .9, .3, 1.1) both; }
@keyframes row-in { from { opacity: 0; transform: translateX(1cqw); } to { opacity: 1; transform: none; } }

/* ---------- layout: feed on the right ---------- */
.overlay { position: absolute; inset: 0; pointer-events: none; }
.overlay[data-layout="feed"] .titles { position: absolute; right: var(--o-edge); top: var(--o-edge); width: 26.25cqw; }
.overlay[data-layout="feed"] .list { position: absolute; right: var(--o-edge); bottom: var(--o-edge); width: 26.25cqw; display: flex; flex-direction: column; gap: .7cqw; }

/* A card is three lines at most: with two lines of nicks or a hint that wraps, the hint gives
   way (fit()); a card without a number keeps an invisible one, so every card is one height */
.card.tight .sub { display: none; }
/* Every heading – the move on a card, the title on a plate – ends with a colon */
.card .what::after, .title .lbl::after { content: ':'; }
.card .what, .title .lbl { white-space: nowrap; }

/* ---------- layout: titles in the top left corner, one event slot right under them ---------- */
/* An empty titles plate keeps its place, so the slot never jumps when it appears; the outgoing
   and the incoming card share one grid cell and cross-fade */
.overlay[data-layout="left"] { display: flex; flex-direction: column; align-items: flex-start; gap: 1.8cqw; padding: var(--o-edge); }
.overlay[data-layout="left"] .titles, .overlay[data-layout="left"] .list { width: 27.75cqw; }
.overlay[data-layout="left"] .list { display: grid; }
.overlay[data-layout="left"] .list .card { grid-area: 1 / 1; }
/* Three lines tall whatever the card holds – heading, nick, hint – so a plain Roll is as high
   as a card with a hint and the slot does not jump; the title plates take the same height */
.overlay[data-layout="left"] .card, .overlay[data-layout="feed"] .card,
.overlay[data-layout="left"] .title, .overlay[data-layout="feed"] .title { grid-template-rows: minmax(3.75cqw, auto); }

/* ---------- layout: one big card in the centre ---------- */
.overlay[data-layout="card"] .titles { display: none; }
.overlay[data-layout="card"] .list { position: absolute; left: 50%; top: 14%; width: 40cqw; transform: translateX(-50%); display: grid; }
.overlay[data-layout="card"] .list .card { grid-area: 1 / 1; padding: 1.6cqw 2cqw; column-gap: 1.6cqw; }
.overlay[data-layout="card"] .card .ico { width: 4.4cqw; height: 4.4cqw; }
.overlay[data-layout="card"] .card .what { font-size: 1.17cqw; }
.overlay[data-layout="card"] .card .who { font-size: 1.9cqw; }
.overlay[data-layout="card"] .card .sub { font-size: 1.3cqw; }
.overlay[data-layout="card"] .card .num { font-size: 5.6cqw; min-width: 8cqw; }

/* ---------- layout: titles bar at the bottom + short lines ---------- */
/* Each title as wide as in the feed (26.25cqw): a narrower one runs the label into a 100. A column
   growing from the bottom: the strip under the titles lifts the lines with them instead of under them */
.overlay[data-layout="hud"] { display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
  gap: 2.3cqw; padding: 0 0 var(--o-edge) 22.4cqw; }
.overlay[data-layout="hud"] .titles { width: 53cqw; grid-template-columns: 1fr 1fr; }
.overlay[data-layout="hud"] .list { order: -1; width: 31.25cqw; display: flex; flex-direction: column; gap: .5cqw; }
.overlay[data-layout="hud"] .card { padding: .55cqw .8cqw; column-gap: .7cqw; }
.overlay[data-layout="hud"] .card .ico { width: 1.9cqw; height: 1.9cqw; }
.overlay[data-layout="hud"] .card .who { font-size: .96cqw; }
.overlay[data-layout="hud"] .card .what { font-size: .7cqw; }
.overlay[data-layout="hud"] .card .sub { font-size: .8cqw; }
.overlay[data-layout="hud"] .card .num { font-size: 2cqw; min-width: 3.6cqw; }
.overlay[data-layout="hud"] .card .num small { display: none; }
/* After the layouts: the invisible number of a card without one takes no width in any of them */
.overlay .card .num.blank { visibility: hidden; min-width: 0; width: 0; overflow: hidden; }

/* ---------- mass flasks: the whole frame for ten seconds ---------- */
/* Outside the stage, which ?scale= narrows: the effect always covers the frame, so its sizes are vw.
   It lies under the stage: the card and the titles stay readable over the fire and the light */
.fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; visibility: hidden; }
.fx.on { visibility: visible; }
.fx > * { position: absolute; }
.fx canvas { left: 0; top: 0; width: 100%; height: 100%; }
.fx-vign { inset: 0; opacity: 0;
  background: radial-gradient(ellipse 75% 70% at 50% 45%, transparent 40%, rgba(25, 0, 6, .55) 72%, rgba(10, 0, 3, .92) 100%); }
.fx-glow { inset: 0; opacity: 0; box-shadow: inset 0 0 6vw rgba(240, 67, 79, .55), inset 0 -4vw 8vw rgba(255, 90, 30, .45);
}
.fx-bed { left: 0; right: 0; bottom: 0; height: 13vw; opacity: 0;
  background: linear-gradient(to top, rgba(255, 150, 60, .9), rgba(240, 67, 79, .5) 30%, rgba(120, 10, 25, .2) 65%, transparent); }
.fx-cracks { left: 0; top: 0; width: 100%; height: 100%; opacity: 0; }
.fx-top { inset: 0; opacity: 0;
  background: radial-gradient(ellipse 70% 45% at 50% -8%, rgba(255, 246, 220, .75), rgba(255, 224, 160, .35) 45%, transparent 75%),
              linear-gradient(90deg, rgba(143, 220, 255, .28), transparent 12%, transparent 88%, rgba(143, 220, 255, .28)); }
.fx-rays { left: 50%; top: -12%; width: 116vw; height: 116vw; margin: -58vw 0 0 -58vw; opacity: 0; }
/* Each fan carries its own round mask and turns with it: the mask is the same at any angle, so a
   turn moves a finished layer instead of masking it again every frame */
.fx-rays i { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 50%; will-change: transform;
  -webkit-mask-image: radial-gradient(circle, #000 0, rgba(0, 0, 0, .6) 28%, transparent 62%);
          mask-image: radial-gradient(circle, #000 0, rgba(0, 0, 0, .6) 28%, transparent 62%); }
.fx-rays i:nth-child(1) { background: repeating-conic-gradient(from 0deg, transparent 0 5deg, rgba(255, 240, 205, .55) 7deg, transparent 9.5deg 17deg); animation: fx-turn 90s linear infinite; }
.fx-rays i:nth-child(2) { background: repeating-conic-gradient(from 4deg, transparent 0 9deg, rgba(143, 220, 255, .4) 11deg, transparent 13deg 23deg); animation: fx-turn 140s linear infinite reverse; }
.fx-lake { left: 0; right: 0; bottom: 0; height: 9vw; opacity: 0;
  background: linear-gradient(to top, rgba(143, 220, 255, .55), rgba(143, 220, 255, .16) 55%, transparent); }
.fx-ring { left: 50%; top: 45%; width: 8vw; height: 8vw; margin: -4vw 0 0 -4vw; border-radius: 50%; opacity: 0; }
.fx-ring.agony { border: .5vw solid rgba(255, 120, 60, .9); box-shadow: 0 0 2.5vw rgba(240, 67, 79, .95), inset 0 0 2vw rgba(60, 0, 10, .9); }
.fx-ring.svet { border: .3vw solid rgba(255, 246, 220, .95); box-shadow: 0 0 2vw rgba(255, 224, 160, .9), inset 0 0 2vw rgba(143, 220, 255, .8); }
.fx-flash { inset: 0; opacity: 0; }
.fx-flash.agony { background: radial-gradient(ellipse at 50% 60%, rgba(255, 120, 60, .7), rgba(176, 16, 42, .75) 50%, rgba(30, 0, 6, .9)); }
.fx-flash.svet { background: radial-gradient(ellipse at 50% 0%, #fffaf0, rgba(255, 236, 190, .85) 40%, rgba(143, 220, 255, .4) 80%); }
.fx-head { left: 0; right: 0; top: 33%; text-align: center; opacity: 0; will-change: transform, opacity; }
.fx.centre .fx-head { top: 50%; } /* under the big centre card */
.fx-big { font: 5.6vw/1.05 'Ruslan Display', 'Golos Text', serif; letter-spacing: .04em; white-space: nowrap; }
/* A letter is its own layer: the letter itself carries the glow as a text-shadow, a copy on top of it
   the gradient. Drawn once, then only moved and faded; a CSS filter on a moving layer would be
   computed again every frame */
.fx-big span { display: inline-block; position: relative; will-change: transform, opacity; }
.fx-big span::before { content: attr(data-ch); position: absolute; left: 0; top: 0;
  -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
.fx-big span.sp { width: .35em; }
.agony .fx-big span { color: #b0102a; text-shadow: 0 0 .5vw rgba(240, 67, 79, .95), 0 .25vw .2vw #000; }
.agony .fx-big span::before { background-image: linear-gradient(to top, #5e0712, #f0434f 38%, #ffab4a 72%, #fff2c4); }
.svet .fx-big span { color: #bfeaff; text-shadow: 0 0 .6vw rgba(255, 224, 160, .95), 0 0 1.6vw rgba(143, 220, 255, .7); }
.svet .fx-big span::before { background-image: linear-gradient(to top, #6cc8f5, #bfeaff 30%, #fff6dc 60%, #ffffff); }
.fx-line { margin-top: .9vw; font: 700 1.5vw/1.2 'Golos Text', system-ui, sans-serif; color: #fff; text-shadow: 0 .15vw .4vw #000, 0 0 1vw #000; }
@keyframes fx-turn { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="fx" id="fx" aria-hidden="true">
  <div class="fx-vign"></div><div class="fx-top"></div><div class="fx-rays"><i></i><i></i></div><div class="fx-lake"></div>
  <div class="fx-bed"></div><canvas></canvas><div class="fx-glow"></div>
  <svg class="fx-cracks" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>
  <div class="fx-ring"></div><div class="fx-ring"></div><div class="fx-flash"></div>
  <div class="fx-head"><div class="fx-big"></div><div class="fx-line"></div></div>
</div>
<div class="stage" id="stage">
  <div class="overlay" id="overlay" data-layout="feed">
    <div class="titles empty" id="titles"></div>
    <div class="list" id="list"></div>
  </div>
</div>
<div class="stage side" id="side"><div class="board" id="board"></div></div>

<script>
(function () {
  'use strict';

  // Everything the overlay says. {n} – a number, {who} – a nick
  var TEXT = {
    roll: 'Roll', extra: 'Доп. Roll', reroll: 'Переброс', curse: 'Проклятие', shield: 'Щит',
    blocked: 'Переброс отбит', blockedCurse: 'Проклятие отбито', cleanse: 'Очищение', lift: 'Проклятие спало',
    flask_swap: 'ФЛАСКА ОБМЕНА', flask_luck: 'ФЛАСКА УДАЧИ', flask_choke: 'ФЛАСКА УДУШЕНИЯ',
    flask_agony: 'АГОНИЯ ЧЕРНОМИРЬЯ', flask_blessing: 'БЛАГОСЛОВЕНИЕ СВЕТЛОЯРА',
    perks: 'Прошлый стрим', bless: 'Благодать', sglaz: 'Сглаз',
    best: 'Достойнейший китежанин', worst: 'Подзалупный китежанин',
    newBest: 'Новый достойнейший китежанин', newWorst: 'Новый подзалупный китежанин',
    outOf: 'из {n}',
    paid: 'за баллы канала',
    cursedNext: 'дальше максимум {n}',
    cursedHold: 'проклятие · ещё {n} мин.',
    firstRoll: 'ещё не бросал, первый Roll',
    curseHit: 'дальше максимум {n}, до {floor}',
    shieldUp: '{n} мин. перебросы не берут',
    blockedShield: 'у цели щит · баллы вернулись',
    blockedBless: 'у цели Благодать · баллы вернулись',
    blockedFlask: 'цель под баффом ФЛАСКИ ОБМЕНА',
    flaskSwap: 'обмен Roll в течение {n} мин. недоступен',
    flaskLuck: 'Roll от {from} · шанс {max} растёт {n} мин.',
    luckRoll: 'удача · шанс {max} был {n}%',
    flaskChoke: 'Roll минус {step} каждую минуту · {n} мин.',
    blockedLuck: 'цель под баффом ФЛАСКИ УДАЧИ',
    agonyRoll: 'АГОНИЯ ЧЕРНОМИРЬЯ · не выше {n}',
    flaskAgony: 'Roll {from}–{to} всем {n} · прокляты {cursed}',
    flaskBlessing: 'Roll {from}–{to} всем {n} · щит {shields} · очищение {cleanses}',
    massLine: '{who} · {sub}',
    cleanseBack: 'Roll вернулся · оберег {n} мин.',
    cleanseFree: 'Roll снова до {max} · оберег {n} мин.',
    liftFree: 'Roll снова до {n}',
    perkBless: 'Благодать на {n} мин.',
    perkSglaz: 'Сглаз · первый Roll не выше {n}',
    blessOn: 'перебросы не берут {n} мин.',
    sglazLaid: 'Сглаз · дальше максимум {n}',
    sglazOn: 'таймер пошёл · первый Roll не выше {ceiling}',
    board: 'Китежанин месяца', boardNow: '{month}, число стримов: {n}', boardFinal: 'итоги за {month}, число стримов: {n}',
    boardWorst: 'Подзалупные китежане', boardBest: 'Достойнейшие китежане', boardNobody: 'никого', boardMore: 'и ещё {n}', boardDrawn: 'жребий',
    months: ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'],
    // The strip under the titles: {month} – the month in the genitive, {n} – a number
    monthsOf: ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'],
    rBest: 'Китежанин {month}', rBestMany: 'Китежане {month}', rWorst: 'Подзалупыш {month}', rWorstMany: 'Подзалупыши {month}',
    rLead: 'Лидер {month}', rLeadMany: 'Лидеры {month}', rNobody: 'пока никого', rMore: 'и ещё {n}',
    rDays: 'ещё {n} дн.', rLastDay: 'последний день', rAfter: 'итоги после стрима',
  };

  var ICON = {
    dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>',
    swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg>',
    chain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="8" width="10" height="8" rx="4" transform="rotate(-35 7.5 12)"/><rect x="11.5" y="8" width="10" height="8" rx="4" transform="rotate(-35 16.5 12)"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8-7.5 9.5-4.3-1.5-7.5-4.9-7.5-9.5V6z"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/><circle cx="19" cy="19" r="1.6"/><circle cx="5" cy="18" r="1.1"/></svg>',
    crown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 18.5h17M4.5 16l-1-9 5 4 3.5-6 3.5 6 5-4-1 9z"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v15m-6-6l6 6 6-6"/></svg>',
    halo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M7 21c0-3.6 2.2-6.5 5-6.5s5 2.9 5 6.5"/><circle cx="12" cy="11.5" r="2.6"/></svg>',
    flask: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path class="liq" d="M6.6 14.5A5.4 5.4 0 0 0 17.4 14.5Z" fill="currentColor" stroke="none"/><path d="M9.5 3h5M10.5 3v5.2a6.5 6.5 0 1 0 3 0V3"/></svg>',
    hourglass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"/><path d="M9.5 19h5l-2.5-2.2z" fill="currentColor" stroke="none"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
  };

  var params = new URLSearchParams(location.search);
  var LAYOUT = ['feed', 'left', 'card', 'hud'].indexOf(params.get('layout')) >= 0 ? params.get('layout') : 'feed';
  var SCALE = Math.min(Math.max(parseFloat(params.get('scale')) || 1, 0.3), 3);
  // Chromium before 105 (the browser of OBS 30 and older) has no container units: every size
  // is rewritten into vw, which is the same width once the scale is folded in
  if (!(window.CSS && CSS.supports('width', '1cqw'))) {
    var sheet = document.querySelector('style');
    sheet.textContent = sheet.textContent.replace(/(-?\d*\.?\d+)cqw/g, function (_, n) { return +(n * SCALE).toFixed(4) + 'vw'; });
  }
  var HIDE_NICKS = params.get('nicks') === '0';
  var REGALIA = params.get('regalia') !== '0';
  var DEMO = ['1', 'mass', 'board'].indexOf(params.get('demo')) >= 0;
  var FX = params.get('fx') !== '0';
  // Minutes the titles stay after the last game event; 0 keeps them on all the time
  var TITLES_MS = (params.get('titles') === null ? 5 : Math.max(0, parseFloat(params.get('titles')) || 0)) * 60000;
  // Seconds the month's board stays on screen
  var BOARD_MS = (params.get('board') === null ? 10 : Math.max(1, parseFloat(params.get('board')) || 10)) * 1000;
  var overlay = document.getElementById('overlay'), list = document.getElementById('list');
  var titlesEl = document.getElementById('titles');
  overlay.setAttribute('data-layout', LAYOUT);
  var stage = document.getElementById('stage');
  stage.setAttribute('data-layout', LAYOUT);
  stage.style.setProperty('--scale', SCALE);
  // The board sits opposite the titles: on the left only when the titles are on the right
  var side = document.getElementById('side');
  side.setAttribute('data-side', LAYOUT === 'feed' ? 'left' : 'right');
  side.style.setProperty('--scale', SCALE);

  function fill(template, values) {
    return template.replace(/\{(\w+)\}/g, function (_, k) { return values[k] === undefined || values[k] === null ? '' : values[k]; });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var aliases = {};
  function name(n) {
    if (!HIDE_NICKS || !n) return n || '';
    if (!aliases[n]) aliases[n] = 'Игрок ' + (Object.keys(aliases).length + 1);
    return aliases[n];
  }
  // The last month's champions: their nick carries a crown wherever the game names them
  var CROWN = '\u265B', crowned = {};
  function nick(n) { return name(n) + (n && crowned[n] ? ' ' + CROWN : ''); }
  // Escaped text with the crown drawn as a glyph of its own: text style, not an emoji
  function rich(s) { return esc(s).split(CROWN).join('<span class="cr">' + CROWN + '&#xFE0E;</span>'); }
  function pair(actor, who, arrow) { return actor && actor !== who ? '@' + nick(actor) + (arrow || ' → ') + '@' + nick(who) : nick(who); }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pct(v, max) { return Math.round(100 * v / (max || 100)) + '%'; }

  // ---------- event -> cards ----------
  function curseSub(ev) {
    if (ev.ceiling === null || ev.ceiling === undefined) return null;
    if (ev.sglaz) return fill(TEXT.sglazLaid, { n: ev.next });
    return ev.hold !== null && ev.hold !== undefined ? fill(TEXT.cursedHold, { n: ev.hold }) : fill(TEXT.cursedNext, { n: ev.next });
  }
  function curseBar(ev) {
    return ev.ceiling !== null && ev.ceiling !== undefined && ev.next !== null && ev.next !== undefined
      ? { from: pct(ev.ceiling, ev.max), to: pct(ev.next, ev.max) } : null;
  }

  function cards(ev) {
    switch (ev.type) {
      case 'roll':
      case 'extra':
        var lucky = ev.luck !== null && ev.luck !== undefined, agonized = ev.agony !== null && ev.agony !== undefined;
        // Under АГОНИЯ the throw is out of its cap, unless a curse caps it lower
        return [{ type: ev.type, cls: agonized ? 'agonized' : lucky ? 'lucky' : '', icon: 'dice', what: TEXT[ev.type], who: nick(ev.who),
          num: ev.value, of: agonized ? Math.min(ev.agony, ev.ceiling || ev.agony) : ev.ceiling || ev.max, bar: curseBar(ev), titles: ev.titles,
          sub: curseSub(ev) || (agonized ? fill(TEXT.agonyRoll, { n: ev.agony }) : lucky ? fill(TEXT.luckRoll, { n: ev.luck, max: ev.max })
            : ev.type === 'extra' ? TEXT.paid : null) }];
      case 'reroll':
        return [{ type: 'reroll', icon: 'swap', what: TEXT.reroll, who: pair(ev.actor, ev.who), num: ev.value, old: ev.old,
          of: ev.ceiling || ev.max, sub: ev.sglaz || ev.old !== null ? curseSub(ev) : TEXT.firstRoll, bar: curseBar(ev), titles: ev.titles }];
      case 'curse':
        return [{ type: 'curse', icon: 'chain', what: TEXT.curse, who: pair(ev.actor, ev.who),
          num: ev.value, of: ev.ceiling, sub: fill(TEXT.curseHit, { n: ev.next, floor: ev.floor }), bar: curseBar(ev), titles: ev.titles }];
      case 'shield':
        return [{ type: 'shield', icon: 'shield', what: TEXT.shield, who: nick(ev.who), sub: fill(TEXT.shieldUp, { n: ev.minutes }) }];
      case 'blocked':
        var potion = ev.by === 'flask' || ev.by === 'luck';
        return [{ type: 'blocked', cls: potion ? 'by-flask' : '', icon: potion ? 'flask' : 'shield',
          what: ev.action === 'curse' ? TEXT.blockedCurse : TEXT.blocked, who: pair(ev.actor, ev.who),
          sub: { bless: TEXT.blockedBless, flask: TEXT.blockedFlask, luck: TEXT.blockedLuck }[ev.by] || TEXT.blockedShield }];
      case 'flask':
        if (ev.flask === 'choke') {
          // The roll as it is now; the steps that wear it down move only the titles
          return [{ type: 'flask', icon: 'flask', what: TEXT.flask_choke, who: nick(ev.who), num: ev.value, of: ev.max,
            sub: fill(TEXT.flaskChoke, { n: ev.minutes, step: ev.step }) }];

        if (ev.flask === 'agony' || ev.flask === 'blessing') {
          // Everyone in chat at once: the card counts them, the titles show where it left the game
          var agony = ev.flask === 'agony';
          return [{ type: 'flask', cls: agony ? 'agony' : 'svet', mass: agony ? 'agony' : 'svet', icon: 'flask', what: TEXT['flask_' + ev.flask], who: nick(ev.who),
            sub: fill(agony ? TEXT.flaskAgony : TEXT.flaskBlessing, { n: ev.crowd, from: ev.from, to: ev.to, cursed: ev.cursed,
              shields: ev.shields, cleanses: ev.cleanses }), titles: ev.titles }];
        }

          return [{ type: 'flask', icon: 'flask', what: TEXT.flask_luck, who: nick(ev.who),
            sub: fill(TEXT.flaskLuck, { n: ev.minutes, from: ev.from, max: ev.max }) }];
        }
        // The number is the buyer's: the old one went to the partner
        return [{ type: 'flask', icon: 'flask', what: TEXT['flask_' + ev.flask] || TEXT.flask_swap, who: pair(ev.actor, ev.who, ' ⇄ '),
          num: ev.value, old: ev.old, sub: fill(TEXT.flaskSwap, { n: ev.minutes }), titles: ev.titles }];
      case 'cleanse':
        return [{ type: 'cleanse', icon: 'spark', what: TEXT.cleanse, who: pair(ev.actor, ev.who), num: ev.value, old: ev.old,
          sub: ev.value !== null ? fill(TEXT.cleanseBack, { n: ev.minutes }) : fill(TEXT.cleanseFree, { n: ev.minutes, max: ev.max }),
          titles: ev.titles }];

        return [{ type: 'lift', icon: 'spark', what: TEXT.lift, who: nick(ev.who), sub: fill(TEXT.liftFree, { n: ev.max }) }];
      case 'perks':
        var out = [];
        if (ev.best) out.push({ type: 'bless', icon: 'halo', what: TEXT.perks, who: nick(ev.best), sub: fill(TEXT.perkBless, { n: ev.minutes }) });

  }

  // The roll scale is the bot's (ROLL_MIN–ROLL_MAX): low is the bottom fifth, high the top one
  var scale = { min: 1, max: 100 };
  function tone(v) {
    if (v === null || v === undefined) return '';

    return v <= Math.floor(scale.min + span * 0.2) ? 'low' : v >= Math.floor(scale.min + span * 0.8) ? 'high' : '';
  }

  function cardEl(c) {
    var el = document.createElement('div');
    el.className = 'card t-' + c.type + (c.cls ? ' ' + c.cls : '');
    var num = '<div class="num blank">0<small>0</small></div>';
    if (c.num !== null && c.num !== undefined) {
      var small = c.old !== null && c.old !== undefined
        ? '<small><span class="strike">' + c.old + '</span> → ' + c.num + '</small>'

  }

  // The number spins before it lands: a dice feel without hiding the result for long
  function spin(el, fast) {
    var n = el.querySelector('.num[data-final]');
    if (!n) return;
    var final = n.getAttribute('data-final'), of = Number(n.getAttribute('data-of')) || scale.max;
    var small = n.querySelector('small'), smallHtml = small ? small.outerHTML : '';

      t++;

      n.innerHTML = rnd(Math.min(scale.min, of), of) + smallHtml;
    }, 55);

  // ---------- titles ----------
  var titles = { best: null, worst: null }, live = true;
  function same(a, b) { return (a && a.nick) === (b && b.nick); }
  function renderTitles(next, flash) {
    var changes = [];
    ['best', 'worst'].forEach(function (k) {
      if (flash && next[k] && titles[k] && !same(next[k], titles[k])) changes.push({ kind: k, title: next[k] });
    });
    titles = { best: next.best || null, worst: next.worst || null };
    function row(kind) {
      var t = titles[kind], changed = changes.some(function (c) { return c.kind === kind; });
      return '<div class="title ' + kind + (changed ? ' changed' : '') + '"><div class="ico">' + ICON[kind === 'best' ? 'crown' : 'down'] + '</div>'
        + '<div style="min-width:0"><div class="lbl">' + esc(TEXT[kind]) + '</div>'
        + '<div class="nick">' + (t ? rich(nick(t.nick)) : '–') + '</div></div><div class="val">' + (t ? t.value : '') + '</div></div>';
    }
    titlesEl.innerHTML = row('best') + row('worst') + stripHtml();
    showTitles();
    return changes;
  }

  // The plate fades once the game has been quiet for TITLES_MS and returns with the next move
  var awakeUntil = 0, sleepTimer = null;
  function showTitles() {
    var asleep = TITLES_MS > 0 && Date.now() >= awakeUntil;
    titlesEl.classList.toggle('empty', !live || (!titles.best && !titles.worst) || asleep);
  }
  function wake(ms) {
    awakeUntil = Date.now() + ms;
    clearTimeout(sleepTimer);
    if (TITLES_MS > 0) sleepTimer = setTimeout(showTitles, ms + 50);
    showTitles();
  }

  // ---------- regalia: the strip under the titles ----------
  // From the bot at start and when a stream starts or ends; the days left are counted here, every minute
  var regalia = null;
  function stripHtml() {
    var r = regalia;
    if (!REGALIA || !r) return '';
    function of(month) { return TEXT.monthsOf[Number(String(month).slice(5, 7)) - 1] || month; }
    function nicks(list, more) {
      var shown = list.slice(0, 3), rest = list.length - shown.length + (more || 0);
      return '<b>' + shown.map(function (n) { return esc(name(n)); }).join(' · ') + '</b>'
        + (rest > 0 ? ' ' + esc(fill(TEXT.rMore, { n: rest })) : '');
    }
    function row(kind, icon, label, body) {
      return '<div class="r-row ' + kind + '"><div class="ico">' + ICON[icon] + '</div><div class="r-text">'
        + esc(label) + ': ' + body + '</div></div>';
    }
    // Last month's winners, then this month's leader, then the days left in it
    var out = '';
    var last = r.last;
    if (last && last.champions.length) {
      out += row('best', 'crown', fill(last.champions.length > 1 ? TEXT.rBestMany : TEXT.rBest, { month: of(last.month) }),
        nicks(last.champions, last.more.champions));
    }
    if (last && last.losers.length) {
      out += row('worst', 'down', fill(last.losers.length > 1 ? TEXT.rWorstMany : TEXT.rWorst, { month: of(last.month) }),
        nicks(last.losers, last.more.losers));
    }
    out += row('lead', 'spark', fill(r.leaders.length > 1 ? TEXT.rLeadMany : TEXT.rLead, { month: of(r.month) }),
      r.leaders.length ? nicks(r.leaders, r.more) + ' ×' + r.titles : esc(TEXT.rNobody));
    var now = Date.now() / 1000, span = r.ends - r.starts;
    var share = Math.min(1, Math.max(0, (now - r.starts) / span));
    var days = Math.ceil((r.ends - now) / 86400);
    var left = days <= 0 ? TEXT.rAfter : days === 1 ? TEXT.rLastDay : fill(TEXT.rDays, { n: days });
    var month = TEXT.months[Number(String(r.month).slice(5, 7)) - 1] || r.month;
    out += '<div class="r-month"><div class="ico">' + ICON.hourglass + '</div><b>' + esc(month.charAt(0).toUpperCase() + month.slice(1)) + '</b>'
      + '<div class="r-bar"><i style="--p:' + (100 * share).toFixed(1) + '%"></i></div><span>' + esc(left) + '</span></div>';

  function updateStrip() {

  }
  function setRegalia(r) {
    regalia = r || null;

    // The title plates carry the crown too
    renderTitles(titles, false);
  }
  setInterval(updateStrip, 60000);

  // ---------- the month's board: opposite the titles for BOARD_MS ----------
  // Not a card: it does not wait in the queue and holds nothing up; a second one replaces it
  var boardEl = document.getElementById('board'), boardTimer = null;
  function showBoard(ev) {
    // The server numbers the rows: a tie on the first place shares it, every row there is lit, a long one ends in «и ещё N»
    function part(kind, top, more) {
      var rows = (top || []).map(function (p, i) {
        var place = p.place || i + 1;
        return '<div class="b-row' + (place === 1 ? ' first' : '') + '" style="animation-delay:' + (0.3 + 0.12 * i).toFixed(2) + 's">'
          + '<div class="b-place">' + place + '</div>'
          + '<div class="b-nick">' + esc(name(p.nick)) + (p.drawn ? ' <small class="b-drawn">' + esc(TEXT.boardDrawn) + '</small>' : '') + '</div><div class="b-val">×' + p.titles + '</div></div>';
      }).join('') || '<div class="b-row none">' + esc(TEXT.boardNobody) + '</div>';
      if (more > 0) rows += '<div class="b-row none">' + esc(fill(TEXT.boardMore, { n: more })) + '</div>';
      return '<div class="b-part ' + kind + '"><div class="b-lbl"><span class="ico">' + ICON[kind === 'best' ? 'crown' : 'down'] + '</span>'
        + '<span>' + esc(TEXT[kind === 'best' ? 'boardBest' : 'boardWorst']) + '</span></div>' + rows + '</div>';
    }
    var month = TEXT.months[Number(String(ev.month).slice(5, 7)) - 1] || ev.month;
    var sub = fill(ev.final ? TEXT.boardFinal : TEXT.boardNow, { month: month, n: ev.streams });
    sub = sub.charAt(0).toUpperCase() + sub.slice(1);  // «Октябрь, …»: the line starts with a capital, the months stay lower case
    boardEl.innerHTML = '<div class="b-head"><div class="b-title">' + esc(TEXT.board) + '</div><div class="b-sub">' + esc(sub) + '</div></div>'
      + part('best', ev.champions, (ev.more || {}).champions) + part('worst', ev.losers, (ev.more || {}).losers);
    boardEl.classList.add('on');
    clearTimeout(boardTimer);
    boardTimer = setTimeout(function () { boardEl.classList.remove('on'); }, BOARD_MS);
  }

  // ---------- mass flasks: the whole frame for ten seconds ----------
  // АГОНИЯ ЧЕРНОМИРЬЯ: the edges darken, lava cracks run in, a wall of fire rises from the bottom
  // and climbs the sides, the title burns and falls to ash. БЛАГОСЛОВЕНИЕ СВЕТЛОЯРА: rays from the top,
  // light falling, the lake shimmering at the bottom. A newer one cuts the older short
  var massFx = (function () {
    var root = document.getElementById('fx'), cv = root.querySelector('canvas'), ctx = cv.getContext('2d');
    function q(sel) { return root.querySelector(sel); }
    var vign = q('.fx-vign'), glow = q('.fx-glow'), bed = q('.fx-bed'), cracksEl = q('.fx-cracks'), top = q('.fx-top'),
      rays = q('.fx-rays'), lake = q('.fx-lake'), flash = q('.fx-flash'), head = q('.fx-head'),
      big = q('.fx-big'), line = q('.fx-line'), rings = root.querySelectorAll('.fx-ring');
    if (LAYOUT === 'card') root.classList.add('centre');
    var LAYERS = { agony: [vign, glow, bed, cracksEl], svet: [top, rays, lake] };
    // The canvas is drawn at half the frame's resolution and stretched: fire and light are soft
    // anyway, and the blending the sprites cost is a quarter
    var END = 10, RES = .5, W = 0, H = 0, S = 1;
    var R = Math.random;
    function rr(a, b) { return a + R() * (b - a); }

    function resize() {
      var k = RES * Math.min(window.devicePixelRatio || 1, 2);
      if (W === window.innerWidth && H === window.innerHeight) return;
      W = window.innerWidth; H = window.innerHeight; S = W / 1920;
      cv.width = Math.round(W * k); cv.height = Math.round(H * k);
      ctx.setTransform(k, 0, 0, k, 0, 0);
    }

    // Soft discs drawn once and stamped scaled: hundreds of gradients a frame would not keep 60 fps
    function disc(stops, size) {
      var c = document.createElement('canvas'); c.width = c.height = size;
      var g = c.getContext('2d'), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      stops.forEach(function (st) { gr.addColorStop(st[0], st[1]); });
      g.fillStyle = gr; g.fillRect(0, 0, size, size);
      return c;
    }
    function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
    var FIRE_RAMP = [[0, [255, 248, 210]], [.15, [255, 205, 90]], [.35, [255, 120, 35]], [.6, [225, 45, 50]], [.85, [120, 12, 30]], [1, [45, 0, 10]]];
    function ramp(t) {
      for (var i = 1; i < FIRE_RAMP.length; i++) {
        if (t <= FIRE_RAMP[i][0]) {
          var a = FIRE_RAMP[i - 1], b = FIRE_RAMP[i], k = (t - a[0]) / (b[0] - a[0]);
          return [0, 1, 2].map(function (j) { return Math.round(a[1][j] + (b[1][j] - a[1][j]) * k); });
        }
      }
      return FIRE_RAMP[FIRE_RAMP.length - 1][1];
    }
    var FIRE = [];
    for (var f = 0; f < 16; f++) {
      var col = ramp(f / 15);
      FIRE.push(disc([[0, rgba(col, 1)], [.35, rgba(col, .55)], [1, rgba(col, 0)]], 64));
    }
    var EMBER = disc([[0, 'rgba(255,245,210,1)'], [.25, 'rgba(255,150,50,.9)'], [1, 'rgba(255,60,20,0)']], 32);
    var SMOKE = disc([[0, 'rgba(22,4,8,.6)'], [.6, 'rgba(22,4,8,.25)'], [1, 'rgba(22,4,8,0)']], 64);
    var ASH = disc([[0, 'rgba(70,60,66,.9)'], [1, 'rgba(70,60,66,0)']], 16);
    var MOTE = {
      gold: disc([[0, 'rgba(255,255,245,1)'], [.3, 'rgba(255,224,160,.8)'], [1, 'rgba(255,224,160,0)']], 32),
      azure: disc([[0, 'rgba(240,252,255,1)'], [.3, 'rgba(143,220,255,.8)'], [1, 'rgba(143,220,255,0)']], 32),
    };
    var STAR = (function () {
      var size = 96, c = document.createElement('canvas'); c.width = c.height = size;
      var g = c.getContext('2d'), m = size / 2;
      g.drawImage(MOTE.gold, m - 14, m - 14, 28, 28);
      [[1, .06], [.06, 1]].forEach(function (d) {
        var gr = g.createRadialGradient(m, m, 0, m, m, m);
        gr.addColorStop(0, 'rgba(255,255,250,1)'); gr.addColorStop(.5, 'rgba(255,236,200,.45)'); gr.addColorStop(1, 'rgba(255,236,200,0)');
        g.save(); g.translate(m, m); g.scale(d[0], d[1]); g.translate(-m, -m);
        g.fillStyle = gr; g.beginPath(); g.arc(m, m, m, 0, Math.PI * 2); g.fill(); g.restore();
      });
      return c;
    })();

    // ---------- particles ----------
    var parts = [], MAX = 1600, acc = {}, mode = null, lakeA = 0, looping = false, last = 0;
    var GLINTS = [];
    for (var g = 0; g < 70; g++) GLINTS.push({ row: Math.pow(R(), 1.4), x: R(), len: rr(30, 170), sp: rr(12, 45) * (R() < .5 ? -1 : 1), ph: R() * 6 });
    // Nothing outlives the ten seconds: a particle born late is given only the time that is left
    function add(p, e) {
      if (parts.length >= MAX) return;
      p.age = 0; p.seed = R() * 10; p.life = Math.min(p.life, END - e);
      if (p.life > 0) parts.push(p);
    }
    function emit(name, rate, dt, fn) {
      acc[name] = (acc[name] || 0) + rate * dt;
      while (acc[name] >= 1) { acc[name] -= 1; fn(); }
    }
    // x across the width, crowded at the edges: the middle of the stream stays readable
    function edgeX() {
      var u = R();
      return (u < .5 ? Math.pow(u * 2, 2.2) * .5 : 1 - Math.pow((1 - u) * 2, 2.2) * .5) * W;
    }
    function envelope(e) {
      if (e < .35) return Math.max(0, e / .35);
      if (e < 6.5) return 1;
      return Math.max(0, 1 - (e - 6.5) / 2.8);
    }
    // Fire tongues: a slow wave along the bottom, the corners burning highest
    function tongue(x, t) {

    }

    function spawnAgony(I, dt, t, e) {
      emit('flame', 380 * I, dt, function () {
        var x = R() * W, tg = tongue(x, t);
        add({ k: 'flame', x: x, y: H + 30 * S, vx: rr(-25, 25) * S, vy: -rr(260, 620) * S * (.2 + .8 * I) * tg, g: -110 * S,
          life: rr(.5, 1.1) * (.4 + .6 * I), size: rr(80, 170) * S * (.45 + .55 * I) * Math.min(1.4, tg), turb: 80 * S }, e);
      });
      emit('side', 170 * I, dt, function () {
        var left = R() < .5, h = Math.pow(R(), 1.7) * H * .85 * I;

      });

        add({ k: 'ember', x: R() < .6 ? edgeX() : R() * W, y: H - rr(0, 80) * S, vx: rr(-50, 50) * S, vy: -rr(110, 300) * S, g: -15 * S,
          life: rr(2, 4.5), size: rr(5, 12) * S, turb: 140 * S }, e);

        add({ k: 'smoke', x: R() < .7 ? edgeX() : R() * W, y: H - rr(30, 160) * S * I, vx: rr(-20, 20) * S, vy: -rr(40, 95) * S,
          life: rr(2.4, 4.4), size: rr(140, 300) * S, turb: 25 * S }, e);
      });
    }
    function spawnSvet(I, dt, e) {
      emit('fall', 60 * I, dt, function () {
        add({ k: 'mote', col: R() < .62 ? 'gold' : 'azure', x: R() < I * .6 ? R() * W : edgeX(), y: -10 * S, vx: rr(-20, 20) * S,
          vy: rr(35, 110) * S, life: rr(4, 7.5), size: rr(6, 14) * S, turb: 45 * S }, e);
      });
      emit('rise', 40 * I, dt, function () {
        add({ k: 'mote', col: R() < .75 ? 'azure' : 'gold', x: R() * W, y: H - rr(0, .1) * H, vx: rr(-15, 15) * S, vy: -rr(25, 80) * S,
          life: rr(3, 5.5), size: rr(5, 11) * S, turb: 30 * S }, e);
      });

          vy: Math.sin(a) * v * .7, drag: 1.4, g: 25 * S, life: rr(2.5, 5), size: rr(6, 15) * S, turb: 30 * S }, .2);

    function convert(kind) {

          else if (p.k === 'smoke') p.life = Math.min(p.life, p.age + .5);

    function update(dt, now) {
